name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip and build APK
        run: |
          unzip -q BELauncher-android.zip
          cd BELauncher
          gradle :app:assembleDebug --no-daemon
      - name: Build test mod
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          $CC -shared -fPIC -O2 -Wl,-z,max-page-size=16384 -o libtestmod.so BELauncher/testmod/testmod.c -llog
      - uses: actions/upload-artifact@v4
        with:
          name: BELauncher-apk
          path: BELauncher/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: testmod-so
          path: libtestmod.so
